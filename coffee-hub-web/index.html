<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>COFFEE-HUB</title>
    <meta
      name="description"
      content="Order fresh coffee, snacks, and quick meals from COFFEE-HUB."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#120d0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="COFFEE-HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      :root {
        color-scheme: dark;
        background: #120d0b;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #120d0b;
      }

      .app-boot {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f5e6d3;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(255, 179, 71, 0.16), transparent 30%),
          linear-gradient(180deg, #120d0b 0%, #0f0b09 100%);
      }

      .app-boot__card {
        width: min(100%, 320px);
        text-align: center;
      }

      .app-boot__logo {
        width: 76px;
        height: 76px;
        object-fit: contain;
        margin-bottom: 18px;
      }

      .app-boot__label {
        margin: 0;
        color: #c08a5d;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.26em;
        text-transform: uppercase;
      }

      .app-boot__title {
        margin: 10px 0 0;
        font-size: 1.45rem;
        font-weight: 800;
      }

      .app-boot__bar {
        position: relative;
        height: 4px;
        margin-top: 22px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
      }

      .app-boot__bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, #c08a5d, #ffb347);
        animation: app-boot-slide 1.1s ease-in-out infinite;
      }

      @keyframes app-boot-slide {
        0% {
          transform: translateX(-120%);
        }

        100% {
          transform: translateX(260%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot__bar::after {
          animation: none;
          transform: translateX(70%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="app-boot" aria-label="Loading Coffee Hub">
        <section class="app-boot__card">
          <img class="app-boot__logo" src="/logo.png" alt="Coffee Hub" />
          <p class="app-boot__label">Coffee Hub</p>
          <h1 class="app-boot__title">Getting your kitchen ready</h1>
          <div class="app-boot__bar" aria-hidden="true"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
